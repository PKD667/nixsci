[project]
name = "nixsci"
version = "0.1.0"
description = "A science stack on Nix: deploy experiments, keep typed records and data, analyse them"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
arrow = ["pyarrow"]
numpy = ["numpy"]
modal = ["modal"]

[project.scripts]
nix-deploy = "nixsci.deploy.cli:main"
nix-lab = "nixsci.lab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nixsci*"]
