[project]
name = "nixsci-lab"
version = "0.1.0"
description = "Typed experiment records, content-addressed data and analysis, with optional remote runs via nixsci-deploy"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
deploy = ["nixsci-deploy"]
numpy = ["numpy"]
arrow = ["pyarrow"]

[project.scripts]
nix-lab = "nixsci.lab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nixsci.lab*"]
