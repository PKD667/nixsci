[project]
name = "nix-deploy"
version = "0.1.0"
description = "Flake-derived compute execution and infrastructure transport"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
modal = ["modal"]

[project.scripts]
nix-deploy = "nix_deploy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nix_deploy"]
