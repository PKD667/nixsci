[project]
name = "nixsci"
version = "0.1.0"
description = "A science stack on Nix: deploy experiments, keep typed records and data, analyse them"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
arrow = ["pyarrow"]
numpy = ["numpy"]
modal = ["modal"]

[project.scripts]
nixsci = "nixsci.cli:main"

[project.entry-points."nixsci.commands"]
deploy = "nixsci.deploy.cli:main"
lab = "nixsci.lab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nixsci.cli", "nixsci.deploy", "nixsci.lab"]

# The repository directory is the `nixsci` namespace: nixsci/deploy is deploy/, and so on.
[tool.setuptools.package-dir]
nixsci = "."
